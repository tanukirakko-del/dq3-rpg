let actx = null, muted = false, bgmTimer = null, bgmCtx = null;
function ac() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function beep(freq, dur, type, vol, when, slideTo) {
  if (muted) return;
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    const t0 = a.currentTime + (when || 0);
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol || 0.05, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function noise(dur, vol, when) {
  if (muted) return;
  try {
    const a = ac(), len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = a.createBufferSource(); src.buffer = buf;
    const g = a.createGain(); g.gain.value = vol || 0.08;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1200;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(a.currentTime + (when || 0));
  } catch (e) {}
}

function bgm(name) {

  if (!name) return;
  const p = BGM_PATTERNS[name]; if (!p) return;

function pushPress(k) { pressedQueue.push(k); }

  if (e.key === 'Enter' || e.key === 'z' || e.key === 'Z') { pushPress('a'); e.preventDefault(); }
  if (e.key === 'Escape' || e.key === 'x' || e.key === 'X') { pushPress('b'); }

window.addEventListener('keyup', (e) => { const k = KEYMAP[e.key]; if (k) held[k] = false; });
function bindHold(el, on, off) {

  const end = (e) => { e.preventDefault(); off(); };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', end);
}

function win(x, y, w, h, fill) {
  ctx.fillStyle = fill || '#101528';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill(); ctx.stroke();
}
function text(str, x, y, opt) {
  opt = opt || {};
  ctx.fillStyle = opt.color || '#fff';
  ctx.font = (opt.bold ? 'bold ' : '') + (opt.size || 16) + 'px sans-serif';
  ctx.textAlign = opt.align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(str, x, y);
}
function wrapLines(str, maxChars) {
  const out = [];
  for (const part of String(str).split('\n')) {
    let line = '';
    for (const ch of part) {
      line += ch;
      if (line.length >= maxChars) { out.push(line); line = ''; }
    }
    out.push(line);
  }
  return out;
}

// ---------- メッセージ＆メニュー（UIスタック） ----------
// 画面下のメッセージウィンドウと、選択メニューを管理する。
// UIが開いている間、フィールド移動は止まる。
let msgState = null;   // {lines, idx, shown, cb, name}
function showMsg(lines, cb, name) {
  if (typeof lines === 'string') lines = [lines];
  const flat = [];
  lines.forEach(l => wrapLines(l, 24).forEach(x => flat.push(x)));
  msgState = { lines: flat, idx: 0, shown: 0, cb: cb || null, name: name || null };
}
function msgActive() { return !!msgState; }
function updateMsg(dt) {
  if (!msgState) return;
  msgState.shown += dt * 42;
  if (takePress('a') || takePress('b')) {
    const cur = msgState.lines.slice(msgState.idx, msgState.idx + 3).join('\n').length;
    if (msgState.shown < cur) { msgState.shown = cur; }
    else {
      SFX.ok();
      msgState.idx += 3;
      msgState.shown = 0;
      if (msgState.idx >= msgState.lines.length) {
        const cb = msgState.cb; msgState = null;
        if (cb) cb();
      }
    }
    clearPress();
  }
}
function drawMsg() {
  if (!msgState) return;
  win(10, H - 158, W - 20, 148);
  const page = msgState.lines.slice(msgState.idx, msgState.idx + 3);
  let all = page.join('\n');
  let n = Math.floor(msgState.shown);
  let y = H - 138;
  if (msgState.name) { text(msgState.name, 28, y, { bold: true, color: '#ffd23e' }); y += 24; all = page.join('\n'); }
  let count = 0;
  for (const line of page) {
    const rest = n - count;
    if (rest <= 0) break;
    text(line.slice(0, rest), 28, y, { size: 17 });
    count += line.length; y += 26;
  }
  if (n >= all.length && Math.floor(performance.now() / 400) % 2 === 0) {
    text('▼', W / 2, H - 42, { align: 'center', size: 14 });
  }
}
// 選択メニュー
let menuState = null;  // {title, items:[{label, sub, disabled}], idx, cb, x,y,w, cols}
function openMenu(opt) {
  menuState = { title: opt.title || null, items: opt.items, idx: 0, cb: opt.cb, x: opt.x, y: opt.y, w: opt.w, cancel: opt.cancel !== false, note: opt.note || null };
  SFX.cursor();
}
function menuActive() { return !!menuState; }
function closeMenu(result) {
  const m = menuState; menuState = null;
  if (m && m.cb) m.cb(result);
}
function updateMenu() {
  if (!menuState) return;
  const m = menuState;
  if (takePress('up')) { m.idx = (m.idx + m.items.length - 1) % m.items.length; SFX.cursor(); }
  if (takePress('down')) { m.idx = (m.idx + 1) % m.items.length; SFX.cursor(); }
  if (takePress('a')) {
    const it = m.items[m.idx];
    if (it && !it.disabled) { SFX.ok(); closeMenu(m.idx); }
    else SFX.cancel();
  }
  if (takePress('b') && m.cancel) { SFX.cancel(); closeMenu(-1); }
  clearPress();
}
function drawMenu() {
  if (!menuState) return;
  const m = menuState;
  const rowH = 26, titleH = m.title ? 30 : 8, noteH = m.note ? 22 : 0;
  const w = m.w || 240, h = titleH + m.items.length * rowH + 12 + noteH;
  const x = m.x !== undefined ? m.x : (W - w - 14), y = m.y !== undefined ? m.y : 14;
  win(x, y, w, h);
  let cy = y + 8;
  if (m.title) { text(m.title, x + 14, cy, { bold: true, color: '#ffd23e' }); cy += 30; }
  m.items.forEach((it, i) => {
    const col = it.disabled ? '#778' : '#fff';
    if (i === m.idx) text('▶', x + 12, cy, { color: '#ffd23e' });
    text(it.label, x + 32, cy, { color: col });
    if (it.sub) text(it.sub, x + w - 12, cy, { align: 'right', color: '#9fd0ff', size: 14 });
    cy += rowH;
  });
  if (m.note) text(m.note, x + 14, cy + 2, { size: 12, color: '#aab' });
}

// マップ
// ワールド凡例: ~=海 .=草原 f=森 ^=山 d=砂漠 ==橋
//   T=はじまりの町 C=王城 t=港町 s=神殿 W=塔 D=洞窟 P=ピラミッド
//   O=オロチの祠 N=不死鳥の祠 M=メダル城 X=魔王城

function buildWorldRows() {
  const w = 38, h = 30, g = [];
  for (let y = 0; y < h; y++) g.push(new Array(w).fill('~'));
  function blob(cx, cy, rx, ry, ch) {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const dx = (x - cx) / rx, dy = (y - cy) / ry;
      if (dx * dx + dy * dy <= 1) g[y][x] = ch;
    }
  }
  function set(x, y, ch) { if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = ch; }
  blob(9, 14, 8.5, 7.5, '.');          // 西の大陸
  blob(27, 14, 8.5, 8.5, '.');         // 東の大陸
  blob(26, 6, 6.5, 3.2, 'd');          // 北東の砂漠
  blob(31, 2, 3.2, 1.8, '.');          // 不死鳥の島
  blob(3, 3, 2.2, 1.8, '.');           // メダル城の島
  blob(24, 25, 2.4, 1.8, '.');         // オロチの島
  blob(25, 23, 1.5, 1.4, '.');         // オロチの島と大陸をつなぐ陸橋（船はオロチ討伐の報酬のため徒歩で届く必要がある）
  // 森と山の飾り
  [[5,11],[6,11],[12,16],[13,17],[4,18],[22,17],[23,18],[33,15],[32,19],[21,10]].forEach(([x, y]) => set(x, y, 'f'));
  [[4,7],[5,7],[7,7],[8,8],[14,8],[30,12],[20,20],[34,10]].forEach(([x, y]) => set(x, y, '^'));
  set(18, 13, '='); set(19, 13, '=');  // 東西をつなぐ橋
  // 魔王城：山に囲まれた島（空からしか行けない）
  for (let y = 2; y <= 4; y++) for (let x = 17; x <= 19; x++) set(x, y, '^');
  set(18, 3, 'X');
  // POI
  set(5, 15, 'T'); set(10, 10, 'C'); set(6, 6, 'W'); set(8, 21, 't');
  set(31, 10, 's'); set(25, 5, 'P'); set(29, 7, 'D');
  set(31, 2, 'N'); set(3, 3, 'M'); set(24, 25, 'O');
  return g.map(r => r.join(''));
}
function buildUnderRows() {
  const w = 24, h = 18, g = [];
  for (let y = 0; y < h; y++) g.push(new Array(w).fill('.'));
  function set(x, y, ch) { if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = ch; }
  [[3,3],[4,4],[18,12],[19,13],[10,6],[15,15]].forEach(([x, y]) => set(x, y, 'f'));
  [[7,5],[8,5],[16,8],[17,8],[5,14]].forEach(([x, y]) => set(x, y, '^'));
  for (let x = 0; x < w; x++) { set(x, 0, '^'); set(x, h - 1, '^'); }
  for (let y = 0; y < h; y++) { set(0, y, '^'); set(w - 1, y, '^'); }
  set(6, 12, 'L'); set(17, 4, 'Z'); set(12, 15, 'U');
  return g.map(r => r.join(''));
}

function pickEncounter(tableName) {
  const t = ENCOUNTERS[tableName]; if (!t) return 'slime';
  let tot = 0; t.forEach(e => tot += e[1]);
  let r = Math.random() * tot;
  for (const e of t) { r -= e[1]; if (r <= 0) return e[0]; }
  return t[0][0];
}

  const w = m.eq.w ? EQUIP_BY_ID[m.eq.w] : null;

  let def = Math.floor(st.agi / 2);

  if (m.eq.h && EQUIP_BY_ID[m.eq.h].sp === 'int') st.int += 10;

}

function gainExp(m, amount, events) {
  if (m.dead) return;
  m.exp += amount;
  while (m.lv < 50 && m.exp >= expForLevel(m.lv + 1)) {
    const before = stats(m);
    m.lv++;
    const after = stats(m);
    m.hp += Math.max(0, after.maxhp - before.maxhp);
    m.mp += Math.max(0, after.maxmp - before.maxmp);
    const learned = JOBS[m.job].spells.filter(([lv, id]) => lv === m.lv).map(([, id]) => SPELLS[id].name);
    events.push({ member: m, learned: learned });
  }
}

const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
let mvT = 0;                 // 移動アニメーション進行（0=静止）
let mvFrom = null, mvTo = null;
let trail = [];              // 隊列用：過去のマス履歴 [{x,y,dir}]
let fieldMsgCd = 0;
function curMap() { return MAPS[G.map]; }
function mapW(m) { return m.rows[0].length; }
function mapH(m) { return m.rows.length; }
function tileAt(mapId, x, y) {
  const m = MAPS[mapId];
  if (x < 0 || y < 0 || x >= mapW(m) || y >= mapH(m)) return m.type === 'world' ? '~' : '#';
  return m.rows[y][x];
}
function isNight() { return G.dayTime >= 0.58 || G.dayTime < 0.06; }
function npcAt(mapId, x, y) {
  const m = MAPS[mapId];
  return (m.npcs || []).find(n => n.x === x && n.y === y && !n.gone && !(n.role && BOSS_FLAGS[n.role] && G && G.flags[BOSS_FLAGS[n.role]]));
}
function walkable(x, y, forNpc) {
  const m = curMap(), t = tileAt(G.map, x, y);
  if (m.type === 'world') {
    if (G.mode === 'fly') return x >= 0 && y >= 0 && x < mapW(m) && y < mapH(m);
    if (G.mode === 'ship') return t === '~' || t === '=' || (t !== '~' && t !== '^');
    if (t === '~' || t === '^') {
      // 船を持っていれば海へ乗り出せる
      if (t === '~' && G.flags.ship && G.map === 'world') return true;
      return false;
    }
    return true;
  }
  if (['#', 'C', 'B', 'K', 'T', 'P'].includes(t)) return false;
  if (!forNpc && npcAt(G.map, x, y)) return false;
  return true;
}
function facingTile() {
  const d = DIRS[G.dir];
  return { x: G.x + d[0], y: G.y + d[1], dx: d[0], dy: d[1] };
}
function startStep(dir) {
  G.dir = dir;
  const d = DIRS[dir];
  const nx = G.x + d[0], ny = G.y + d[1];
  const m = curMap();
  // 飛行モードの着陸はAボタンで行う。ここでは移動のみ
  if (!walkable(nx, ny)) { return; }
  // 海への出発（船）
  if (m.type === 'world' && G.mode === 'walk' && tileAt(G.map, nx, ny) === '~' && G.flags.ship) {
    G.mode = 'ship'; SFX.warp();
    showMsg('船に 乗り込んだ！');
  }
  mvFrom = { x: G.x, y: G.y };
  mvTo = { x: nx, y: ny };
  mvT = 0.0001;
}
function finishStep() {
  trail.unshift({ x: mvFrom.x, y: mvFrom.y, dir: G.dir });
  trail = trail.slice(0, 8);
  G.x = mvTo.x; G.y = mvTo.y;
  mvFrom = mvTo = null; mvT = 0;
  G.steps++;
  G.dayTime = (G.dayTime + 0.004) % 1;
  G.party.forEach(mm => { if (mm.poison && !mm.dead && mm.hp > 1) mm.hp--; });
  if (G.repel > 0) G.repel--;
  onStepTile();
}
function onStepTile() {
  const m = curMap(), t = tileAt(G.map, G.x, G.y);
  if (m.type === 'world') {
    if (t === 'U' && G.map === 'under') {
      G.mode = 'walk';
      enterMap('world', 18, 5);
      showMsg('不思議な光に 包まれ、地上へ 戻った！');
      return;
    }
    if (G.mode === 'ship' && t !== '~' && t !== '=') {
      G.mode = 'walk';
      showMsg('上陸した。');
    }
    if (POI_ENTER[t] && G.mode !== 'fly') {
      const dest = POI_ENTER[t];
      G.returnTo = { map: G.map, x: G.x, y: G.y };
      enterMap(dest, defaultSpawn(dest).x, defaultSpawn(dest).y);
      return;
    }
    maybeEncounter();
  } else {
    if (t === 'X') {
      const rt = G.returnTo || { map: 'world', x: 5, y: 16 };
      enterMap(rt.map, rt.x, rt.y);
      return;
    }
    maybeEncounter();
  }
}
function defaultSpawn(mapId) {
  const m = MAPS[mapId];
  for (let y = 0; y < mapH(m); y++) for (let x = 0; x < mapW(m); x++) {
    if (m.rows[y][x] === 'X') return { x: x, y: y - 1 };
  }
  return { x: 2, y: 2 };
}
function enterMap(id, x, y) {
  G.map = id; G.x = x; G.y = y;
  trail = [];
  const m = curMap();
  if (m.type === 'town' && !G.visited.includes(id)) G.visited.push(id);
  if (m.type === 'town') G.lastTown = id;
  bgm(m.bgm || 'field');
  saveGame('auto');
}
function worldZone() {
  if (G.map === 'under') return 'under';
  if (G.mode === 'ship') return 'sea';
  const x = G.x, y = G.y;
  if (x >= 20 && y >= 18) return 'worldD';
  if (x >= 20 || y <= 8) return 'worldC';
  if (x >= 12 || y <= 11) return 'worldB';
  return 'worldA';
}
function maybeEncounter() {
  const m = curMap();
  if (mode !== 'field' || msgActive() || menuActive()) return;
  if (G.mode === 'fly') return;
  let table = null, rate = 0.11;
  if (m.type === 'world') table = worldZone();
  else if (m.enc) { table = m.enc; rate = 0.13; }
  else return;
  if (isNight()) rate *= 1.3;
  if (G.repel > 0 && (table === 'worldA' || table === 'worldB')) rate = 0;
  if (Math.random() < rate) {
    const id = pickEncounter(table);
    const mon = MONSTERS[id];
    const n = 1 + Math.floor(Math.random() * Math.min(mon.max, 3));
    startBattle(Array(n).fill(id), {});
  }
}

const TILE_STYLE = {
  '~': ['#2b5ea7', '#2b5ea7'], '.': ['#57a639', '#57a639'], 'f': ['#3d8b2f', '#3d8b2f'],
  '^': ['#8d8577', '#8d8577'], 'd': ['#e0c184', '#e0c184'], '=': ['#b08954', '#b08954'],
};
const POI_EMOJI = { T: '🏘️', C: '🏰', t: '⚓', s: '⛩️', W: '🗼', D: '🕳️', P: '🔺', O: '⛩️', N: '🕊️', M: '🏯', X: '🏰', L: '🏘️', Z: '🏰', U: '🌀' };
const POI_IMG = { T: 'tile_town', C: 'tile_castle', t: 'tile_harbor', s: 'tile_shrine', W: 'tile_tower', D: 'tile_cave', P: 'tile_pyramid', O: 'tile_shrine', N: 'tile_phoenix', M: 'tile_medal', X: 'tile_demon', L: 'tile_town', Z: 'tile_demon', U: 'tile_portal' };
function drawTileImg(name, sx, sy, size) {
  const im = IMG[name];
  if (!imgOk(im)) return false;
  const s = size || TILE * 1.12;
  const w = s * im.naturalWidth / im.naturalHeight;
  ctx.drawImage(im, sx + TILE / 2 - w / 2, sy + TILE - s + 2, w, s);
  return true;
}
function drawTile(t, sx, sy, mapId) {
  const inWorld = MAPS[mapId].type === 'world';
  if (inWorld) {
    const st = TILE_STYLE[t];
    if (st) {
      ctx.fillStyle = (t === 'f' || t === '^') ? '#57a639' : st[0];
      ctx.fillRect(sx, sy, TILE, TILE);
      if (t === 'f') { if (!drawTileImg('tile_forest', sx, sy)) { ctx.font = '30px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🌲', sx + TILE / 2, sy + 6); } }
      else if (t === '^') { if (!drawTileImg('tile_mountain', sx, sy)) { ctx.font = '30px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('⛰️', sx + TILE / 2, sy + 6); } }
      else if (t === '~') { ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(sx + 6, sy + 12, 12, 3); ctx.fillRect(sx + 22, sy + 28, 12, 3); }
      else if (t === 'd') { ctx.fillStyle = 'rgba(160,120,60,0.5)'; ctx.fillRect(sx + 8, sy + 30, 10, 3); }
    } else if (POI_IMG[t] || POI_EMOJI[t]) {
      ctx.fillStyle = t === 'P' ? '#e0c184' : (t === 'U' ? '#4a3550' : '#57a639');
      ctx.fillRect(sx, sy, TILE, TILE);
      if (!(POI_IMG[t] && drawTileImg(POI_IMG[t], sx, sy, TILE * 1.22))) {
        ctx.font = '30px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(POI_EMOJI[t] || '🏠', sx + TILE / 2, sy + 5);
      }
    } else { ctx.fillStyle = '#57a639'; ctx.fillRect(sx, sy, TILE, TILE); }
    if (mapId === 'under') { ctx.fillStyle = 'rgba(46,16,64,0.25)'; ctx.fillRect(sx, sy, TILE, TILE); }
    return;

  }

  const camY = clamp(py - 4.5, 0, Math.max(0, mapH(m) - VIEW));

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 420);
  for (let sy = 0; sy < VIEW; sy++) for (let sx = 0; sx < VIEW; sx++) {
    const tx = Math.floor(camX) + sx, ty = Math.floor(camY) + sy;
    const dx = (tx - camX) * TILE, dy = (ty - camY) * TILE;
    if (tx < 0 || ty < 0 || tx >= mapW(m) || ty >= mapH(m)) { ctx.fillStyle = m.type === 'world' ? '#2b5ea7' : '#222'; ctx.fillRect(dx, dy, TILE, TILE); continue; }

    drawChar(n.img, dx, dy, n.hue, n.big, false);
  });

  }

    if (mem.dead) { ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('⚰️', dx + TILE / 2, dy + 10 + bob); continue; }
    drawChar(JOBS[mem.job].img, dx, dy + (i === 0 ? bob : -bob), 0, false, mem.job === 'sage');
  }

  if (m.type === 'dungeon') { ctx.fillStyle = 'rgba(8,8,24,0.16)'; ctx.fillRect(0, 0, W, 420); }

  ctx.fillStyle = '#0d1122'; ctx.fillRect(0, 420, W, H - 420);

  if (G.mode === 'ship') text('⛵航行中', W - 12, 428, { size: 13, align: 'right', color: '#9fd0ff' });
  if (G.mode === 'fly') text('🦅飛行中（Aで着陸）', W - 12, 428, { size: 13, align: 'right', color: '#9fd0ff' });
}
function drawChar(imgName, dx, dy, hue, big, sageGlow) {

function castFieldSpell(m, id) {
  const sp = SPELLS[id];
  const pay = () => { m.mp -= sp.mp; SFX.spell(); };
  if (sp.kind === 'heal') {
    memberMenu('誰を 回復する？', t => !t.dead, (t) => { pay(); const st = stats(t); t.hp = Math.min(st.maxhp, t.hp + R(sp.pow[0], sp.pow[1])); SFX.heal(); showMsg(t.name + ' の HPが 回復した！'); });
  } else if (sp.kind === 'healFull') {
    memberMenu('誰を 回復する？', t => !t.dead, (t) => { pay(); t.hp = stats(t).maxhp; SFX.heal(); showMsg(t.name + ' の HPが 全回復した！'); });
  } else if (sp.kind === 'healAll') {
    pay(); G.party.forEach(t => { if (!t.dead) t.hp = Math.min(stats(t).maxhp, t.hp + R(sp.pow[0], sp.pow[1])); }); SFX.heal(); showMsg('全員の HPが 回復した！');
  } else if (sp.kind === 'cure') {
    memberMenu('誰の 毒を なおす？', t => !t.dead, (t) => { pay(); t.poison = false; SFX.heal(); showMsg(t.name + ' の 毒が 消えた！'); });
  } else if (sp.kind === 'revive') {
    memberMenu('誰を 生き返らせる？', t => t.dead, (t) => {
      pay();
      if (Math.random() < 0.5) { t.dead = false; t.hp = Math.floor(stats(t).maxhp / 2); SFX.fanfare(); showMsg(t.name + ' は 生き返った！'); }
      else showMsg('…しかし ' + t.name + ' は 生き返らなかった。');
    });
  } else if (sp.kind === 'warp') {
    const underGroup = ['under', 'lasttown', 'lastdun'].includes(G.map);
    const towns = G.visited.filter(t => ['under', 'lasttown', 'lastdun'].includes(t) === underGroup && MAPS[t].type === 'town');
    if (!towns.length) { showMsg('行ける町が ない。'); return; }
    openMenu({ title: 'どの町へ？', items: towns.map(t => ({ label: MAPS[t].name })), cb: (r) => {
      if (r < 0) return;
      pay(); SFX.warp();
      const sp2 = defaultSpawn(towns[r]);
      enterMap(towns[r], sp2.x, sp2.y);
      G.mode = 'walk';
    } });
  } else if (sp.kind === 'exit') {
    if (curMap().type !== 'dungeon') { showMsg('ここでは 使えない。'); return; }
    pay(); SFX.warp();
    const rt = G.returnTo || { map: 'world', x: 5, y: 16 };
    enterMap(rt.map, rt.x, rt.y);
  }
}

let casino = null;
function doCasino() {

      } });

      casino = { reels: [0, 0, 0], spin: [true, true, true], bet: 1, t: 0, phase: 'bet', msg: '賭ける枚数を えらんでね' };
    } else if (r === 2) {
      const prizes = [{ c: 150, item: 'yakusou', n: 5, label: 'やくそう×5' }, { c: 300, equip: 'tenshitsue', label: 'てんしのつえ' }, { c: 600, equip: 'sabakitsue', label: 'さばきのつえ' }];
      openMenu({ title: '景品（所持 ' + G.coins + '枚）', items: prizes.map(p => ({ label: p.label, sub: p.c + '枚', disabled: G.coins < p.c })), cb: (r2) => {

      } });
    }
  } });
}
const SLOT_SYMBOLS = ['🍒', '⭐', '🔔', '🍇', '💎', '7️⃣'];
const SLOT_PAY = { '💎': 50, '7️⃣': 30, '⭐': 15, '🔔': 8, '🍇': 5, '🍒': 4 };
function updateCasino(dt) {
  const c = casino;
  c.t += dt;
  if (c.phase === 'bet') {
    if (takePress('up')) { c.bet = c.bet >= Math.min(10, G.coins) ? 1 : c.bet + 1; SFX.cursor(); }
    if (takePress('down')) { c.bet = c.bet <= 1 ? Math.min(10, G.coins) : c.bet - 1; SFX.cursor(); }
    if (takePress('a')) {
      if (G.coins < c.bet) { c.msg = 'コインが 足りない！'; }
      else { G.coins -= c.bet; c.phase = 'spin'; c.spin = [true, true, true]; c.msg = 'Aで リールを 止めて！'; SFX.ok(); }
    }
    if (takePress('b')) { casino = null; SFX.cancel(); }
    clearPress(); return;
  }
  if (c.phase === 'spin') {
    if (c.t > 0.08) { c.t = 0; c.reels = c.reels.map((v, i) => c.spin[i] ? R(0, 5) : v); }
    if (takePress('a')) {
      const idx = c.spin.indexOf(true);
      if (idx >= 0) { c.spin[idx] = false; SFX.hit(); if (!c.spin.includes(true)) { c.phase = 'result'; c.t = 0; } }
    }
    if (takePress('b')) { c.spin = [false, false, false]; c.phase = 'result'; c.t = 0; }
    clearPress(); return;
  }
  if (c.phase === 'result' && c.t > 0.5 && !c.done) {
    c.done = true;
    const [a, b, d] = c.reels.map(i => SLOT_SYMBOLS[i]);
    let win = 0;
    if (a === b && b === d) win = c.bet * SLOT_PAY[a];
    else if (a === b || b === d || a === d) win = c.bet * 2;
    if (win > 0) { G.coins += win; c.msg = a + b + d + ' ！ ' + win + '枚 ゲット！'; SFX.fanfare(); }
    else { c.msg = a + b + d + ' … ハズレ。また 挑戦してね'; SFX.cancel(); }
  }
  if (c.phase === 'result' && c.done && takePress('a')) { casino = null; clearPress(); }
  if (takePress('b')) { casino = null; clearPress(); }
}
function drawCasino() {
  if (!casino) return;
  ctx.fillStyle = 'rgba(5,5,16,0.82)'; ctx.fillRect(0, 0, W, H);
  win(30, 150, W - 60, 300);
  text('🎰 スロット', W / 2, 172, { align: 'center', bold: true, size: 22, color: '#ffd23e' });
  casino.reels.forEach((v, i) => {
    const x = 78 + i * 92;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(x, 220, 80, 90, 10); ctx.fill();
    ctx.font = '44px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(SLOT_SYMBOLS[v], x + 40, 242);
  });
  text('コイン ' + G.coins + ' 枚', W / 2, 330, { align: 'center', size: 16 });
  if (casino.phase === 'bet') text('賭け金： ' + casino.bet + ' 枚（↑↓で変更、Aでスタート）', W / 2, 360, { align: 'center', size: 14, color: '#9fd0ff' });
  text(casino.msg, W / 2, 396, { align: 'center', size: 14 });

function updateBattle(dt) {
  if (B.anim) { B.anim.t += dt; if (B.anim.t >= B.anim.dur) B.anim = null; }
  if (B.pop) { B.pop.t += dt; if (B.pop.t > 0.9) B.pop = null; }
  if (msgActive()) { updateMsg(dt); return; }
  if (menuActive()) { updateMenu(); return; }
  if (B.queue.length) { const fn = B.queue.shift(); fn(); return; }
  if (B.phase === 'command') { nextCommand(); return; }
  if (B.phase === 'exec') { executeRound(); return; }
}
function drawBattle() {
  if (!B) return;
  const m = curMap();
  let bgName = 'bg_field';
  if (m.type === 'dungeon') bgName = 'bg_dungeon';
  else if (G.map === 'under') bgName = 'bg_under';
  else if (G.mode === 'ship') bgName = 'bg_sea';
  else if (isNight()) bgName = 'bg_night';
  const bgIm = IMG[bgName];
  if (imgOk(bgIm)) {
    const scale = Math.max(W / bgIm.naturalWidth, 480 / bgIm.naturalHeight);
    const bw = bgIm.naturalWidth * scale, bh = bgIm.naturalHeight * scale;
    ctx.drawImage(bgIm, (W - bw) / 2, 480 - bh, bw, bh);
    ctx.fillStyle = 'rgba(0,0,0,0.16)'; ctx.fillRect(0, 296, W, 184);
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, 480);
    if (m.type === 'dungeon') { grad.addColorStop(0, '#141428'); grad.addColorStop(1, '#3a2f4a'); }
    else if (G.map === 'under') { grad.addColorStop(0, '#241a3e'); grad.addColorStop(1, '#4a2f52'); }
    else if (isNight()) { grad.addColorStop(0, '#101a3e'); grad.addColorStop(1, '#3e5a8a'); }
    else { grad.addColorStop(0, '#79a6ff'); grad.addColorStop(1, '#cfe8ff'); }
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, 480);
    ctx.fillStyle = m.type === 'dungeon' ? '#2c2438' : (G.mode === 'ship' ? '#2b5ea7' : '#4d8a3d');
    ctx.fillRect(0, 300, W, 180);
  }
  // 敵
  const foes = B.enemies.map((e, i) => ({ e, i })).filter(x => !x.e.dead && !x.e.fled);
  const slotW = Math.min(170, (W - 30) / Math.max(1, foes.length));
  foes.forEach(({ e, i }, k) => {
    const im = IMG[e.img];
    const bossH = e.boss ? 215 : 140;
    const cx = W / 2 + (k - (foes.length - 1) / 2) * slotW;
    let ox = 0;
    ctx.save();
    if (B.anim && B.anim.side === 'e' && B.anim.idx === i) {
      ox = R(-4, 4);
      if (Math.floor(B.anim.t * 20) % 2 === 0) ctx.filter = 'brightness(2.6)';
    }
    if (imgOk(im)) {
      const h = bossH, w = h * im.naturalWidth / im.naturalHeight;
      ctx.drawImage(im, cx - w / 2 + ox, 300 - h, w, h);
    } else {
      ctx.fillStyle = '#c33'; ctx.beginPath(); ctx.arc(cx + ox, 230, 50, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    text(e.name, cx + ox, 308, { align: 'center', size: 13, bold: true });
    // HPバー（ボスのみ数値も）
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(cx - 34, 330, 68, 7);
    ctx.fillStyle = e.hp / e.maxhp > 0.3 ? '#7dff8a' : '#ff5a5a';
    ctx.fillRect(cx - 33, 331, 66 * Math.max(0, e.hp / e.maxhp), 5);
    if (B.pop && B.pop.side === 'e' && B.pop.idx === i) {
      text(String(B.pop.txt), cx, 250 - B.pop.t * 40, { align: 'center', bold: true, size: 22, color: B.pop.color });
    }
  });
  if (!foes.length && B.phase !== 'intro') text('', 0, 0);
  // 味方ステータス
  G.party.forEach((mm, i) => {
    const x = 8 + i * 103, y = 356, w = 97, h = 118;
    const active = B.phase === 'command' && B.cmdFor === i;
    win(x, y, w, h, mm.dead ? '#2a1420' : '#101528');
    if (active) { ctx.strokeStyle = '#ffd23e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x - 2, y - 2, w + 4, h + 4, 9); ctx.stroke(); }
    const st = stats(mm);
    text(mm.name.slice(0, 5), x + 8, y + 8, { bold: true, size: 14, color: mm.dead ? '#f88' : '#fff' });
    text(JOBS[mm.job].name, x + 8, y + 28, { size: 11, color: '#9fd0ff' });
    text('Lv ' + mm.lv, x + 8, y + 46, { size: 12 });
    if (mm.dead) text('しんでいる', x + 8, y + 68, { size: 12, color: '#f88' });
    else {
      text('HP ' + mm.hp, x + 8, y + 68, { size: 13, color: mm.hp / st.maxhp <= 0.25 ? '#ff9f43' : '#fff' });
      text('MP ' + mm.mp, x + 8, y + 88, { size: 12 });
      if (mm.poison) text('どく', x + 8, y + 104, { size: 11, color: '#c8f169' });
    }
    if (B.pop && B.pop.side === 'p' && B.pop.idx === i) {
      text(String(B.pop.txt), x + w / 2, y - 26 - B.pop.t * 30, { align: 'center', bold: true, size: 20, color: B.pop.color });
    }
  });
  ctx.fillStyle = '#0d1122'; ctx.fillRect(0, 480, W, H - 480);
  if (msgActive()) drawMsg();
  if (menuActive()) drawMenu();
}
// ============================================================
// タイトル・エンディング・メインループ
// ============================================================
const BOSS_FLAGS = { orochi: 'orochiDown', baramos: 'baramosDown', zoma: 'zomaDown' };
function anySave() { return !!(slotInfo('auto') || slotInfo(1) || slotInfo(2) || slotInfo(3)); }
function updateTitle() {
  if (nameCb) return;
  if (titlePhase === 'main') {
    const has = anySave();
    if (takePress('up') || takePress('down')) { titleSel = has ? (1 - titleSel) : 0; SFX.cursor(); }
    if (titleSel === 1 && !has) titleSel = 0;
    if (takePress('a')) {
      SFX.ok();
      if (titleSel === 0) {
        askName('ゆうしゃの なまえは？', 'ゆうしゃ', (nm) => {
          newGame(nm || 'ゆうしゃ');
          showMsg(['16年前、父である勇者オルテガは 魔王討伐に 旅立ち、帰らなかった…。',
                   'そして今、その子が 旅立つ日が 来た。',
                   'まずは 酒場で 仲間を 集めて、北の お城で 王様に 会おう。']);
        });
      } else { titlePhase = 'slot'; titleSel = 0; }
    }
  } else if (titlePhase === 'slot') {
    const slots = ['auto', 1, 2, 3].filter(s => slotInfo(s));
    if (!slots.length) { titlePhase = 'main'; }
    else {
      if (takePress('up')) { titleSel = (titleSel + slots.length - 1) % slots.length; SFX.cursor(); }
      if (takePress('down')) { titleSel = (titleSel + 1) % slots.length; SFX.cursor(); }
      if (takePress('b')) { titlePhase = 'main'; titleSel = 0; }
      if (takePress('a')) { SFX.ok(); if (loadGame(slots[titleSel])) showMsg('ぼうけんを 再開した！'); }
    }
  }
  clearPress();
}
function drawTitle() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1b2a5e'); grad.addColorStop(1, '#0d1122');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  const im = IMG.title;
  if (imgOk(im)) {
    const w = 372, h = w * im.naturalHeight / im.naturalWidth;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(W / 2 - w / 2 - 6, 30, w + 12, h + 12, 12); ctx.fill();
    ctx.restore();
    ctx.drawImage(im, W / 2 - w / 2, 36, w, h);
  }
  text('ドラクエ風クエスト3', W / 2, 268, { align: 'center', bold: true, size: 33, color: '#ffd23e' });
  text('〜 ちいさな大冒険 〜', W / 2, 310, { align: 'center', size: 17, color: '#cfe0ff' });
  if (titlePhase === 'main') {
    const opts = anySave() ? ['はじめから', 'つづきから'] : ['はじめから'];
    opts.forEach((o, i) => {
      if (i === titleSel) text('▶', W / 2 - 78, 372 + i * 40, { size: 20, color: '#ffd23e' });
      text(o, W / 2, 372 + i * 40, { align: 'center', size: 20, bold: i === titleSel });
    });
  } else {
    text('どの 記録で 再開する？', W / 2, 356, { align: 'center', size: 15, color: '#9fd0ff' });
    const slots = ['auto', 1, 2, 3].filter(s => slotInfo(s));
    slots.forEach((s, i) => {
      const info = slotInfo(s);
      if (i === titleSel) text('▶', 52, 392 + i * 36, { size: 17, color: '#ffd23e' });
      text(info.label + '：' + info.hero + ' Lv' + info.lv, 78, 392 + i * 36, { size: 16, bold: i === titleSel });
      text(info.place, W - 52, 392 + i * 36, { align: 'right', size: 13, color: '#9fd0ff' });
    });
    text('B：もどる', W / 2, 392 + slots.length * 36 + 14, { align: 'center', size: 13, color: '#aab' });
  }
  text('ファンメイドの 小さなRPG ／ セーブは端末内', W / 2, H - 34, { align: 'center', size: 12, color: '#7787aa' });
}
// ---------- エンディング ----------
let ending = null;
const ENDING_LINES = [
  '大魔王ゾーマは 倒れた…！',
  '闇は 晴れ、地下世界に 初めて 光が 差し込んだ。',
  '人々は 歓喜し、勇者の名は 伝説となった。',
  '父の意志を 継いだ 小さな勇者の 大冒険は、',
  'こうして 幕を 閉じたのである。',
  '…遊んでくれて ありがとう！',
];
function startEnding() {
  B = null;
  mode = 'ending';
  ending = { t: 0 };
  bgm('title');
  if (G) saveGame('auto');
}
function updateEnding(dt) {
  ending.t += dt;
  if (ending.t > 13 && takePress('a')) {
    ending = null; mode = 'title'; titlePhase = 'main'; titleSel = 0;
  }
  clearPress();
}
function drawEnding() {
  ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 60; i++) {
    const x = (i * 67) % W, y = (i * 97) % 300;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + 0.2 * Math.sin(performance.now() / 700 + i)) + ')';
    ctx.fillRect(x, y, 2, 2);
  }
  ENDING_LINES.forEach((l, i) => {
    if (ending.t > 1 + i * 1.5) text(l, W / 2, 90 + i * 34, { align: 'center', size: 16 });
  });
  if (ending.t > 10.5) {
    text('THE END', W / 2, 330, { align: 'center', bold: true, size: 42, color: '#ffd23e' });
    const mins = Math.floor(G.playSec / 60), secs = Math.floor(G.playSec % 60);
    text('プレイ時間 ' + mins + '分' + secs + '秒', W / 2, 400, { align: 'center', size: 15, color: '#9fd0ff' });
    text('ゆうしゃ Lv' + G.party[0].lv + '　ちいさいメダル ' + G.medals + '枚', W / 2, 428, { align: 'center', size: 15, color: '#9fd0ff' });
    text('パーティ：' + G.party.map(m => m.name + '（' + JOBS[m.job].name + ' Lv' + m.lv + '）').join('、'), W / 2, 456, { align: 'center', size: 12, color: '#cfe0ff' });
  }
  if (ending.t > 13 && Math.floor(performance.now() / 500) % 2 === 0) {
    text('Aボタン：タイトルへ', W / 2, H - 60, { align: 'center', size: 14, color: '#aab' });
  }
}
// ---------- メインループ ----------
let lastTs = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, lastTs ? (ts - lastTs) / 1000 : 0.016);
  lastTs = ts;
  if (G && (mode === 'field' || mode === 'battle')) G.playSec += dt;
  if (mode === 'title') { updateTitle(); drawTitle(); }
  else if (mode === 'field') {
    updateField(dt);
    drawField();
    if (casino) drawCasino();
    if (msgActive()) drawMsg();
    if (menuActive()) drawMenu();
  }
  else if (mode === 'battle') { updateBattle(dt); drawBattle(); }
  else if (mode === 'ending') { updateEnding(dt); drawEnding(); }
}
requestAnimationFrame(loop);
bgm('title');
function drawPartyStatus() {
  G.party.forEach((m, i) => {
    const x = 8 + i * 103, y = 452, w = 97, h = 120;
    win(x, y, w, h, m.dead ? '#2a1420' : '#101528');
    const st = stats(m);
    text(m.name.slice(0, 5), x + 8, y + 8, { bold: true, size: 14, color: m.dead ? '#f88' : '#fff' });
    text(JOBS[m.job].name, x + 8, y + 28, { size: 11, color: '#9fd0ff' });
    text('Lv ' + m.lv, x + 8, y + 46, { size: 12 });
    if (m.dead) { text('しんでいる', x + 8, y + 68, { size: 12, color: '#f88' }); }
    else {
      text('HP ' + m.hp + '/' + st.maxhp, x + 8, y + 68, { size: 12, color: m.hp / st.maxhp <= 0.25 ? '#ff9f43' : '#fff' });
      text('MP ' + m.mp + '/' + st.maxmp, x + 8, y + 88, { size: 12 });
      if (m.poison) text('どく', x + 8, y + 104, { size: 11, color: '#c8f169' });
    }
  });
  text(fmt(G.gold) + ' G', W - 12, 586, { align: 'right', size: 14, color: '#ffd23e' });
  text('🏅' + G.medals, W - 12, 606, { align: 'right', size: 13, color: '#ffd23e' });
}
